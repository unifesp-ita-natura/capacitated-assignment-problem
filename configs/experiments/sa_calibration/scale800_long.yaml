experiment_name: sa_scale800_long
description:
  goal: >
    Medir quanto do gap do SA em 800 setores vem do orçamento: as mesmas configs
    de scale800.yaml com 1M iterações em vez de 200k.
  hypothesis: >
    O gap contra o ótimo do Gurobi cai com o orçamento, já que 200k iterações dão
    só ~17 movimentos por par (setor, combinação) em 800 setores.
  design_note: >
    Complemento de scale800.yaml: orçamento 5× maior (1M, α derivado, sem estagnação)
    só em s800, para separar o efeito do orçamento. Configs
    tpe_b0_04 e lhs_32, seeds 101–108. O MIP é o mesmo de scale800.yaml (os mesmos
    parâmetros de memória), copiado só para o relatório ter o z_ref.
  status: exploratory

output_dir: experiments/sa_calibration/outputs/scale800_long
n_workers: 8

level_strategy: naive_last
shape_strategy: plain_average

budget:
  max_iterations: 1000000
  trace_every: 5000
  energy_mode: peak_std_breach

instances:
  s800: {n_sectors: 800, n_cycles_horizon: 3, seed: 800, mip_time_limit: 3600}

mip_solvers: [appsi_gurobi]
mip_rel_gaps: [0.0001]
mip_extra_options:
  appsi_gurobi:
    Threads: 2
    NodefileStart: 0.5
    NodefileDir: experiments/sa_calibration/outputs/scale800_long/gurobi/nodes_{instance}
    SoftMemLimit: 4.0
    SolFiles: experiments/sa_calibration/outputs/scale800_long/gurobi/{instance}_sol
    LogFile: experiments/sa_calibration/outputs/scale800_long/gurobi/{instance}.log

sa_configs:
  # tpe_b0_04, recomendada pelo fine-tuning peak_std (α derivado do orçamento).
  tuned_peak_std:
    {initial_temperature: 20273.98334487975, min_temperature: 6.182498621764997, sector_bias: 0.2625420089142143, destination_bias: 0.7836051510233553, penalty_coefficient: 310.8830628790512, w_std: 1.9976341220491365, w_range: 0.3242119688600368}
  # lhs_32, a calibração anterior (fitness de amplitude), como comparação.
  lhs_32_range:
    {initial_temperature: 257.24750757958907, min_temperature: 0.011046064901330649, sector_bias: 0.7693508846294949, destination_bias: 0.24677194539982686, penalty_coefficient: 146.35163758759955, energy_mode: range}

sa_seeds: [101, 102, 103, 104, 105, 106, 107, 108]
