experiment_name: lightgbm_tuning
description:
  goal: >
    How much of the pooled model's remaining gap to naive:mean is
    hyperparameters rather than features? And does the stage 1 explanation
    hold — that a 7-leaf model was capacity-starved, so extra correlated
    columns supplied split points rather than information?
  hypothesis: >
    A small gain, 1 to 3 percent. The configuration in use until now (100
    rounds at lr 0.05, no early stopping, no subsampling, no penalty) was
    never tuned against anything. But the sensitivity grid run before the
    roadmap showed a monotone preference for smaller, shorter models, which
    is evidence there is little structure to fit. If the stage 1 reading is
    right, giving the model real capacity should recover a similar ~1%.
  design_note: >
    Varies capacity and regularization together, as a grid, on top of
    everything stages 1-3 approved (companion_lags [1,2,3,4],
    rolling_windows [2,3], ratio target). Boosting runs up to 2000 rounds
    with early stopping on the last cycle of each fold's TRAINING window,
    so the number of rounds is chosen without seeing the cycle being
    forecast. Known limitation, and it is the serious one: the grid is
    scored on the same folds the roadmap's earlier stages used, so the
    winner's MAE is optimistic as an estimate of unseen-data error. Stage 0
    is what fixes this; until then, prefer the regularization principle
    over the grid minimum. A second limitation found after running: the
    bagging_fraction axis had no effect at all, because LightGBM ignores it
    unless bagging_freq > 0 and that stayed at its default of 0 — so this
    grid tested four axes, not five. Re-tested separately with
    bagging_freq 1, bagging does not help (0.7 -> 1808.3 against 1803.9
    without it), so the ranking stands.
  status: confirmed

split:
  horizon: 1
  min_train_cycles: 6
  window: expanding

fixed:
  n_estimators: 2000
  early_stopping_rounds: 50
  validation_cycles: 1
  min_child_samples: 5
  companion_lags: [1, 2, 3, 4]
  rolling_windows: [2, 3]
  target: ratio
  random_state: 0

grid:
  learning_rate: [0.02, 0.05]
  num_leaves: [7, 15, 31]
  feature_fraction: [0.7, 1.0]
  bagging_fraction: [0.7, 1.0]
  lambda_l2: [0.0, 5.0]

paths:
  base_csv: data/base_tratada.csv
  output_csv: experiments/lightgbm_tuning/outputs/grid.csv
