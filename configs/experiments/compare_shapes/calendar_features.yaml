split:
  min_train_cycles: 20
  horizon: 1
  window: expanding

candidates:
  - name: uniform
    model: uniform
  - name: sector_10_bins
    model: sector
    n_bins: 10
  - name: lightgbm_position
    model: lightgbm
    learning:
      features: []
  - name: lightgbm_organization_calendar
    model: lightgbm
    learning:
      features: [CD_RE, CD_GV, weekday, month]
      n_estimators: 100
      learning_rate: 0.05
      num_leaves: 15
      min_child_samples: 30
  - name: lightgbm_weekday
    model: lightgbm
    learning:
      features: [weekday]

paths:
  base_csv: data/base_tratada_v2.csv
  run_dir: experiments/compare_shapes/outputs/shape_calendar_v01
