experiment_name: relax_and_fix_binding
description:
  goal: >
    Quando a capacidade dos CDs restringe o ótimo de verdade, o Relax-and-Fix ainda fica
    perto do MIP, e o backtracking resolve as janelas que ficam sem solução?
  hypothesis: >
    Em full.yaml o ótimo era o mesmo com capacidade folgada e apertada (quem prende é o
    churn). Com a capacidade mais baixa o ótimo muda, e é perto da fronteira de viabilidade
    que a decomposição por janelas tende a falhar, porque congelar CDs cedo demais pode não
    deixar completação viável. Espero que sem backtracking o R&F fique sem solução em
    algum ponto e que com backtracking ele recupere uma solução viável.
  design_note: >
    800 setores, 2 ciclos, seed 7, mesmo gerador. tight_headroom 0.80/0.75/0.70/0.65: o As-Is
    estoura o pior CD em ~20%/25%/30%/35%. 0.65 é inviável para o próprio MIP (confirmado nos
    dois solvers). R&F com fatias de ~100 setores, sem backtracking (B0) e com o padrão (B2).
    Uma seed. O MIP de referência usa mip_rel_gap 1e-4 e 600 s.
  status: confirmed  # resultado em experiments/relax_and_fix/README.md

output_dir: experiments/relax_and_fix/outputs/binding
mip:
  solver: appsi_highs
  mip_rel_gap: 0.0001
optimize_passes: 2
subproblem_time_limit: 120

instances:
  n800_binding_080: {n_sectors: 800, n_cycles_horizon: 2, seed: 7, capacity: tight, tight_headroom: 0.80, mip_time_limit: 600}
  n800_binding_075: {n_sectors: 800, n_cycles_horizon: 2, seed: 7, capacity: tight, tight_headroom: 0.75, mip_time_limit: 600}
  n800_binding_070: {n_sectors: 800, n_cycles_horizon: 2, seed: 7, capacity: tight, tight_headroom: 0.70, mip_time_limit: 600}
  n800_binding_065: {n_sectors: 800, n_cycles_horizon: 2, seed: 7, capacity: tight, tight_headroom: 0.65, mip_time_limit: 600}

windows:
  - {window: 3, step: 2, max_group_sectors: 100, max_backtracks: 0}
  - {window: 3, step: 2, max_group_sectors: 100}
