# Região e gerência como features do LightGBM na base v2: mesmos parâmetros,
# só categorical_features varia (ver docs/guides/forecasting-level-organization.md).
# Para repetir, troque paths.run_dir: uma pasta existente não é sobrescrita.
split:
  min_train_cycles: 20
  horizon: 1
  window: expanding

candidates:
  - model: lightgbm
    label: lgbm_sem_organizacao
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 7
  - model: lightgbm
    label: lgbm_regiao
    categorical_features: [CD_RE]
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 7
  - model: lightgbm
    label: lgbm_gerencia
    categorical_features: [CD_GV]
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 7
  - model: lightgbm
    label: lgbm_regiao_gerencia
    categorical_features: [CD_RE, CD_GV]
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 7

paths:
  base_csv: data/base_tratada_v2.csv
  run_dir: experiments/compare_forecasters/outputs/2026-10-07_v2_organizacao
